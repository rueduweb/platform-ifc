<div class="team-edit-backdrop">
  <form
    class="team-edit-card"
    novalidate
    aria-labelledby="edit-team-title"
    (submit)="save($event)"
  >
    <!-- Décoration de la fenêtre -->
    <div class="team-edit-decoration" aria-hidden="true"></div>

    <!-- En-tête -->
    <header class="team-edit-header">
      <button
        type="button"
        (click)="cancel()"
        aria-label="Fermer la fenêtre"
        class="team-edit-close"
      >
        ✕
      </button>

      <h2 id="edit-team-title" class="team-edit-title">
        Modifier l’équipe
      </h2>

      <p class="team-edit-subtitle">
        ses statistiques
      </p>
    </header>

    <!-- Nom de l'équipe -->
    <div class="team-edit-name">
      <input
        id="team-name"
        type="text"
        [formField]="teamForm.name"
        [attr.aria-invalid]="
          teamForm.name().invalid() && teamForm.name().touched()
        "
        aria-label="Nom de l’équipe"
        placeholder="Nom de l’équipe"
        class="team-edit-input"
      />

      @if (teamForm.name().invalid() && teamForm.name().touched()) {
        <p class="team-edit-error">
          Le nom de l’équipe est obligatoire.
        </p>
      }
    </div>
    <div class="team-edit-stats">
      <div class="team-edit-field">
        <label for="nbW">Victoires</label>
        <input id="nbW" type="number" step="1"
          [formField]="teamForm.nbW"
          class="team-edit-input" />
      </div>

      <div class="team-edit-field">
        <label for="nbGoal">Buts marqués</label>
        <input id="nbGoal" type="number" step="1"
          [formField]="teamForm.nbGoal"
          class="team-edit-input" />
      </div>

      <div class="team-edit-field">
        <label for="nbD">Matchs nuls</label>
        <input id="nbD" type="number" step="1"
          [formField]="teamForm.nbD"
          class="team-edit-input" />
      </div>

      <div class="team-edit-field">
        <label for="nbConce">Buts encaissés</label>
        <input id="nbConce" type="number" step="1"
          [formField]="teamForm.nbConce"
          class="team-edit-input" />
      </div>

      <div class="team-edit-field">
        <label for="nbL">Défaites</label>
        <input id="nbL" type="number" step="1"
          [formField]="teamForm.nbL"
          class="team-edit-input" />
      </div>
    </div>
    <!-- Actions -->
    <footer class="team-edit-actions">
      <button
        type="button"
        (click)="cancel()"
        class="team-edit-btn team-edit-btn-cancel"
      >
        Annuler
      </button>

      <button
        type="submit"
        [disabled]="!teamForm().valid()"
        class="team-edit-btn team-edit-btn-save"
      >
        Enregistrer
      </button>
    </footer>
  </form>
</div>
