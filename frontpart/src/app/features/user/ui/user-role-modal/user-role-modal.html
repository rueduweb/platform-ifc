<div class="user-role-modal-overlay">

  <div class="user-role-modal">

    <!-- Décoration rose -->
    <span
      class="user-role-modal__pink-corner"
      aria-hidden="true"
    ></span>

    <!-- Décoration noire -->
    <span
      class="user-role-modal__black-corner"
      aria-hidden="true"
    ></span>


    <!-- CONTENU -->

    <div class="user-role-modal__content">

      <h2 class="user-role-modal__title">
        Modifier le rôle
      </h2>


      @if (saveError(); as errorMessage) {

        <div
          class="user-role-modal__error"
          role="alert"
        >
          <div class="user-role-modal__error-content">

            <i
              class="fa-solid fa-circle-exclamation"
              aria-hidden="true"
            ></i>

            <div>
              <p class="user-role-modal__error-title">
                La modification a échoué
              </p>

              <p class="user-role-modal__error-message">
                {{ errorMessage }}
              </p>
            </div>

          </div>
        </div>

      }


      <form
        class="user-role-modal__form"
        (submit)="$event.preventDefault(); onSubmit()"
      >

        <!-- RÔLE -->

        <div class="user-role-modal__role">

          <label
            for="role"
            class="sr-only"
          >
            Rôle
          </label>

          <div class="user-role-modal__select-wrapper">

            <select
              id="role"
              [formField]="roleForm.role"
              class="user-role-modal__select"
            >
              <option value="USER">
                Utilisateur
              </option>

              <option value="ADMIN">
                Administrateur
              </option>
            </select>

            <span
              class="user-role-modal__chevron"
              aria-hidden="true"
            ></span>

          </div>

          @if (
            roleForm.role().touched()
            && roleForm.role().invalid()
          ) {
            <p class="user-role-modal__validation">
              Le rôle est obligatoire.
            </p>
          }

        </div>


        <!-- INFORMATIONS UTILISATEUR -->

        <div class="user-role-modal__user-info">

          <p class="user-role-modal__username">
            {{ user().username }}
          </p>

          <p class="user-role-modal__current-value">
            Valeur actuelle:
            {{ formModel().role }}
          </p>

        </div>


        <!-- ================================================= -->
        <!-- FOOTER                                             -->
        <!-- ================================================= -->

        <footer class="user-role-modal__footer">

          <button
            type="button"
            class="user-role-modal__cancel"
            (click)="onClose()"
          >
            Annuler
          </button>

          <button
            type="submit"
            class="user-role-modal__save"
            [disabled]="
              roleForm().invalid()
              || roleForm().submitting()
            "
          >
            @if (roleForm().submitting()) {
              Enregistrement...
            } @else {
              Enregistrer
            }
          </button>

        </footer>

      </form>

    </div>

  </div>

</div>
