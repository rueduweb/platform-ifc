<article
  class="user-card relative isolate overflow-hidden
         rounded-[0_0_80px_0] border border-neutral-300
         bg-white shadow-sm"
>
  <!-- Football en arrière-plan -->
  <div
    class="user-card__football"
    aria-hidden="true"
  ></div>

  <!-- Décorations graphiques -->
  <div class="user-card__black-shape" aria-hidden="true"></div>
  <div class="user-card__pink-shape" aria-hidden="true"></div>

  <!-- Logo -->
  <div
    class="user-card__logo"
    aria-hidden="true"
  >
    <span>$index</span>
  </div>

  <!-- HEADER -->
  <header
    class="relative z-10 flex h-[108px] items-center
           border-b border-neutral-800 pl-[132px] pr-8"
  >
    <h2
      class="truncate text-[20px] font-normal uppercase
             tracking-wide text-neutral-700"
    >
      {{ user().username }}
    </h2>

    <!-- Actions -->
    <div class="ml-auto flex items-center gap-5">
      <!-- Visibility -->
      <button
        type="button"
        class="user-card__action user-card__action--view"
        title="Afficher"
        aria-label="Afficher l'utilisateur"
        (click)="onToggleVisibility()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>

      <!-- Edit -->
      <button
        type="button"
        class="user-card__action user-card__action--edit"
        title="Modifier"
        aria-label="Modifier l'utilisateur"
        (click)="onEdit()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="m4 20 4.2-1 10.4-10.4-3.2-3.2L5 15.8 4 20Z" />
          <path d="m13.9 6.1 3.2 3.2" />
        </svg>
      </button>

      <!-- Delete -->
      <button
        type="button"
        class="user-card__action user-card__action--delete"
        title="Supprimer"
        aria-label="Supprimer l'utilisateur"
        (click)="onRemove()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          aria-hidden="true"
        >
          <path d="M6 6 18 18" />
          <path d="M18 6 6 18" />
        </svg>
      </button>
    </div>
  </header>

  <!-- BODY -->
  <section
    class="relative z-10 px-9 pb-8 pt-10"
  >
    <dl class="space-y-7">

      <!-- Email -->
      <div>
        <dt
          class="text-[20px] font-normal uppercase
                 tracking-wide text-neutral-700"
        >
          Email :
        </dt>

        <dd
          class="mt-2 truncate text-[17px] text-neutral-600"
        >
          {{ user().email }}
        </dd>
      </div>

      <!-- Role -->
      <div>
        <dt
          class="text-[20px] font-normal uppercase
                 tracking-wide text-neutral-700"
        >
          Role :
        </dt>

        <dd
          class="mt-2 text-[17px] text-neutral-600"
        >
          {{ user().role }}
        </dd>
      </div>

      <!-- Articles -->
      <div>
        <dd
          class="font-mono text-[17px] text-neutral-700"
        >
          Auteur avec {{ articleCount }} articles
        </dd>
      </div>

      <!-- Created date -->
      <div>
        <dd
          class="font-mono text-[17px] text-neutral-700"
        >
          Crée le:
          <span
            class="text-neutral-500"
          >
            {{ createdDate ?? 'createdDate' }}
          </span>
        </dd>
      </div>

      <!-- Updated date -->
      <div>
        <dd
          class="font-mono text-[15px] text-neutral-400"
        >
          dernière modification:
          <span>
            {{ updatedDate ?? 'updatedDate' }}
          </span>
        </dd>
      </div>

    </dl>
  </section>
</article>
