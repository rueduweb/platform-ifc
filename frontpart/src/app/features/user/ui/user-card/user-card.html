<article class="user-card">
  <!-- Halo / dégradé -->
  <div class="user-card__gradient" aria-hidden="true"></div>

  <!-- Petit arc fuchsia -->
  <div class="user-card__pink-arc" aria-hidden="true"></div>

  <!-- Ballon -->


  <!-- Triangle vert -->
  <div
    class="user-card__green-shape"
    aria-hidden="true"
  ></div>

  <!-- HEADER -->
  <header class="user-card__header">
    <h2 class="user-card__username">
      {{ user().username }}
    </h2>

    <div class="user-card__actions">
      <button
        type="button"
        class="user-card__action user-card__action--edit"
        title="Modifier"
        aria-label="Modifier l'utilisateur"
        (click)="onEdit()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="m4 20 4.2-1 10.4-10.4-3.2-3.2L5 15.8 4 20Z" />
          <path d="m13.9 6.1 3.2 3.2" />
        </svg>
      </button>

      <button
        type="button"
        class="user-card__action user-card__action--delete"
        title="Supprimer"
        aria-label="Supprimer l'utilisateur"
        (click)="onRemove()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M6 7h12" />
          <path d="M9 7V5h6v2" />
          <path d="m8 7 .7 12h6.6L16 7" />
          <path d="M10 10v6" />
          <path d="M14 10v6" />
        </svg>
      </button>
    </div>
  </header>

  <!-- BODY -->
  <section class="user-card__body">
    <dl class="user-card__details">

      <div class="user-card__row">
        <dt>Email:</dt>
        <dd>{{ user().email }}</dd>
      </div>

      <div class="user-card__row">
        <dt>Rôle:</dt>
        <dd>{{ user().role }}</dd>
      </div>

      <div class="user-card__row">
        <dt>Auteur avec</dt>
        <dd>{{ articleCount }} articles</dd>
      </div>

      <div class="user-card__row">
        <dt>Crée le:</dt>
        <dd>
          {{ user().createdAt ?? 'createdAt' }}
        </dd>
      </div>

      <div class="user-card__row user-card__row--muted">
        <dt>dernière modification:</dt>
        <dd>
          {{ user().updatedAt ?? 'updatedAt' }}
        </dd>
      </div>

    </dl>
  </section>
</article>
