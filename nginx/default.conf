# Redirection du domaine principal vers HTTPS
server {
    listen 80;
    server_name plateforme-ifc.com www.plateforme-ifc.com;

    return 301 https://$host$request_uri;
}

# Frontend Angular en HTTPS
server {
    listen 443 ssl;
    server_name plateforme-ifc.com www.plateforme-ifc.com;

    ssl_certificate /etc/letsencrypt/live/plateforme-ifc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plateforme-ifc.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirection HTTP de l'API vers HTTPS
server {
    listen 80;
    server_name api.plateforme-ifc.com;

    return 301 https://$host$request_uri;
}

# Backend NestJS en HTTPS
server {
    listen 443 ssl;
    server_name api.plateforme-ifc.com;

    ssl_certificate /etc/letsencrypt/live/plateforme-ifc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plateforme-ifc.com/privkey.pem;

    location / {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
