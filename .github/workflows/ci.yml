name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backpart
    env:
      # Valeurs factices : aucun secret réel n'est utilisé en CI
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backpart/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Lint (lecture seule)
        run: npx eslint "{src,test}/**/*.ts"
      - run: npm run build
      - run: npm test
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontpart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontpart/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --no-watch
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker-build:
    # Construit les images de production sans les publier
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { context: backpart, file: backpart/Dockerfile.prod }
          - { context: frontpart, file: frontpart/Dockerfile.prod }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
